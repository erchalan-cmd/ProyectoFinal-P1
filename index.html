<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0c1715">
  <title>Gestor Inteligente para Escuela de Fútbol</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0c1715;
      --surface: #14221e;
      --surface-2: #192a24;
      --line: #2b4038;
      --text: #edf5ef;
      --muted: #9aafa2;
      --green: #43db91;
      --green-dark: #1e8c5c;
      --lime: #c8f36a;
      --blue: #75baff;
      --orange: #ffba6b;
      --red: #ff7777;
      --shadow: 0 18px 60px #0003;
      font-family: Inter, "Segoe UI", Arial, sans-serif;
      font-synthesis: none;
      background: var(--bg);
      color: var(--text);
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      background:
        radial-gradient(ellipse at 88% -12%, #1d4835 0, transparent 38%),
        radial-gradient(ellipse at -15% 60%, #18352b 0, transparent 35%),
        var(--bg);
    }

    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
      outline: 3px solid var(--lime);
      outline-offset: 2px;
    }

    .app-shell { min-height: 100vh; }
    .hidden { display: none !important; }
    .account-menu { display: flex; align-items: center; gap: 8px; }
    .account-name { max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text); font-size: 12px; }
    .sidebar {
      position: fixed;
      z-index: 5;
      inset: 0 auto 0 0;
      display: flex;
      width: 248px;
      flex-direction: column;
      padding: 24px 16px;
      border-right: 1px solid #ffffff0d;
      background: #0e1b17ed;
      backdrop-filter: blur(18px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 4px 10px 26px;
    }

    .brand-mark {
      display: grid;
      width: 42px;
      height: 42px;
      place-items: center;
      border-radius: 14px;
      background: linear-gradient(145deg, var(--lime), var(--green));
      color: #10241b;
      font-size: 23px;
      font-weight: 900;
      box-shadow: 0 7px 22px #43db9140;
    }

    .brand strong { display: block; font-size: 13px; line-height: 1.25; }
    .brand small { display: block; margin-top: 4px; color: var(--muted); font-size: 11px; }
    .nav-label {
      padding: 12px 12px 8px;
      color: #71877b;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .13em;
      text-transform: uppercase;
    }

    .nav-list { display: grid; gap: 5px; }
    .nav-button {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      padding: 11px 12px;
      border: 1px solid transparent;
      border-radius: 11px;
      background: transparent;
      color: #b1c3b7;
      text-align: left;
      transition: .18s ease;
    }
    .nav-button:hover { background: #ffffff09; color: var(--text); }
    .nav-button.active {
      border-color: #43db912e;
      background: linear-gradient(90deg, #43db911e, #43db9108);
      color: var(--lime);
    }
    .nav-icon { width: 20px; color: inherit; font-size: 17px; text-align: center; }
    .sidebar-footer { margin-top: auto; padding: 14px 10px 0; color: var(--muted); font-size: 11px; }

    .main-area { min-height: 100vh; margin-left: 248px; }
    .topbar {
      position: sticky;
      z-index: 4;
      top: 0;
      display: flex;
      min-height: 72px;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 12px clamp(20px, 4vw, 52px);
      border-bottom: 1px solid #ffffff0d;
      background: #0c1715c9;
      backdrop-filter: blur(18px);
    }
    .breadcrumb { color: var(--muted); font-size: 13px; }
    .breadcrumb strong { color: var(--text); }
    .top-actions { display: flex; align-items: center; gap: 10px; }
    .today-chip {
      padding: 9px 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: #c2d2c8;
      font-size: 12px;
    }
    .content { width: min(1500px, 100%); margin: 0 auto; padding: 34px clamp(20px, 4vw, 52px) 64px; }
    .page-heading { display: flex; align-items: flex-end; justify-content: space-between; gap: 18px; margin-bottom: 24px; }
    .eyebrow { margin-bottom: 8px; color: var(--green); font-size: 11px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(26px, 4vw, 36px); letter-spacing: -.04em; }
    .page-description { max-width: 690px; margin: 9px 0 0; color: var(--muted); line-height: 1.6; }
    h2, h3, p { margin-top: 0; }
    h2 { margin-bottom: 5px; font-size: 17px; letter-spacing: -.02em; }
    h3 { margin-bottom: 6px; font-size: 15px; }
    .muted { color: var(--muted); }
    .small { font-size: 12px; }
    .row { display: flex; align-items: center; gap: 10px; }
    .row.wrap { flex-wrap: wrap; }
    .row.between { justify-content: space-between; }
    .stack { display: grid; gap: 16px; }
    .grid { display: grid; gap: 16px; }
    .grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .grid-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .grid-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }

    .card {
      min-width: 0;
      padding: 20px;
      border: 1px solid #ffffff10;
      border-radius: 17px;
      background: linear-gradient(145deg, #192a24, #13201c);
      box-shadow: var(--shadow);
      animation: enter .3s ease both;
    }
    @keyframes enter { from { opacity: 0; transform: translateY(7px); } to { opacity: 1; transform: translateY(0); } }
    .card-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
    .card-header p { margin: 4px 0 0; color: var(--muted); font-size: 12px; line-height: 1.45; }

    .button {
      display: inline-flex;
      min-height: 40px;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 9px 14px;
      border: 1px solid transparent;
      border-radius: 10px;
      background: linear-gradient(120deg, var(--green), #7de6a3);
      color: #092016;
      font-size: 13px;
      font-weight: 800;
      transition: transform .15s ease, filter .15s ease;
    }
    .button:hover { filter: brightness(1.08); transform: translateY(-1px); }
    .button.secondary { border-color: var(--line); background: #ffffff09; color: var(--text); }
    .button.ghost { min-height: 34px; padding: 6px 9px; border-color: transparent; background: transparent; color: #b8c8be; }
    .button.danger { border-color: #ff777735; background: #ff777718; color: #ff9b9b; }
    .button.small-button { min-height: 32px; padding: 5px 9px; font-size: 11px; }
    .button:disabled { cursor: not-allowed; opacity: .45; transform: none; }

    .metric-card { position: relative; overflow: hidden; min-height: 135px; }
    .metric-card::after { position: absolute; right: -16px; bottom: -40px; width: 105px; height: 105px; border: 1px solid #43db9120; border-radius: 50%; content: ""; box-shadow: 0 0 0 16px #43db9108, 0 0 0 32px #43db9105; }
    .metric-label { color: var(--muted); font-size: 12px; }
    .metric-value { margin: 12px 0 5px; font-size: 32px; font-weight: 800; letter-spacing: -.05em; }
    .metric-foot { color: #91aa9a; font-size: 11px; }
    .metric-icon { position: absolute; top: 18px; right: 18px; font-size: 21px; opacity: .8; }

    .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 16px; }
    .toolbar .search { flex: 1 1 230px; }
    .input, .select, .textarea {
      width: 100%;
      min-height: 41px;
      padding: 10px 12px;
      border: 1px solid #344a40;
      border-radius: 10px;
      background: #0e1915;
      color: var(--text);
    }
    .textarea { min-height: 85px; resize: vertical; }
    .input::placeholder, .textarea::placeholder { color: #75897d; }
    .field { display: grid; gap: 7px; }
    .field > span { color: #b9cbbf; font-size: 12px; font-weight: 650; }
    .form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
    .form-grid .full { grid-column: 1 / -1; }
    .form-actions { display: flex; justify-content: flex-end; gap: 9px; margin-top: 18px; }
    .form-error { min-height: 17px; margin: 10px 0 0; color: var(--red); font-size: 12px; }
    .inline-form { padding: 18px; border: 1px solid var(--line); border-radius: 14px; background: #0f1b16; }

    .player-grid, .exercise-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
    .player-card { padding: 17px; border: 1px solid #ffffff10; border-radius: 15px; background: #172720; }
    .avatar { display: grid; width: 43px; height: 43px; flex: 0 0 auto; place-items: center; border: 1px solid #8be6ad35; border-radius: 14px; background: #43db9118; color: var(--lime); font-weight: 850; }
    .player-name { margin: 0; font-size: 15px; }
    .player-meta { margin: 5px 0 13px; color: var(--muted); font-size: 11px; }
    .player-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; padding: 10px 0; border-top: 1px solid #ffffff0d; border-bottom: 1px solid #ffffff0d; }
    .player-stats strong { display: block; font-size: 14px; }
    .player-stats span { color: var(--muted); font-size: 10px; }
    .card-actions { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 10px; }
    .badge { display: inline-flex; align-items: center; padding: 5px 9px; border: 1px solid #43db912c; border-radius: 999px; background: #43db9112; color: #a3ebbd; font-size: 10px; font-weight: 750; }
    .badge.blue { border-color: #75baff35; background: #75baff12; color: #9bcaff; }
    .badge.orange { border-color: #ffba6b35; background: #ffba6b12; color: #ffca8d; }
    .badge.red { border-color: #ff777735; background: #ff777712; color: #ff9999; }
    .category-tech { color: var(--lime); }
    .category-tactic { color: var(--blue); }
    .category-physical { color: var(--orange); }
    .category-mental { color: #d6a5ff; }

    .exercise-card { padding: 17px; border: 1px solid #ffffff10; border-radius: 14px; background: #172720; }
    .exercise-card p { margin: 8px 0; color: #b4c5ba; font-size: 12px; line-height: 1.5; }
    .exercise-card .exercise-material { color: #819589; font-size: 11px; }
    .exercise-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
    .exercise-actions { display: flex; gap: 8px; margin-top: 14px; }
    .exercise-demo {
      height: 150px;
      margin-top: 14px;
      overflow: hidden;
      border: 1px solid #ffffff16;
      border-radius: 12px;
      background: #1a3b2e;
    }
    .exercise-demo svg { width: 100%; height: 100%; display: block; }
    .exercise-demo .demo-label { fill: #edf5ef; font-family: Inter, "Segoe UI", Arial, sans-serif; font-size: 10px; font-weight: 700; }
    .exercise-guide { margin-top: 12px; padding-top: 12px; border-top: 1px solid #ffffff10; }
    .exercise-guide ol { margin: 8px 0 12px; padding-left: 20px; color: #cfdbd2; font-size: 12px; line-height: 1.65; }
    .exercise-timer { min-width: 82px; font-size: 24px; font-weight: 800; text-align: right; }

    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    th { padding: 10px; color: #859a8d; font-size: 10px; letter-spacing: .08em; text-align: left; text-transform: uppercase; }
    td { padding: 12px 10px; border-top: 1px solid #ffffff0d; color: #cfdbd2; vertical-align: middle; }
    tbody tr:hover { background: #ffffff05; }

    .alert-list, .recommendation-list { display: grid; gap: 9px; }
    .alert-item, .recommendation-item { display: flex; gap: 11px; padding: 12px; border: 1px solid #ffffff0d; border-radius: 12px; background: #ffffff05; }
    .alert-dot { width: 9px; height: 9px; flex: 0 0 auto; margin-top: 5px; border-radius: 50%; background: var(--orange); box-shadow: 0 0 13px currentColor; }
    .alert-dot.high { background: var(--red); }
    .alert-item strong, .recommendation-item strong { display: block; margin-bottom: 3px; font-size: 12px; }
    .alert-item p, .recommendation-item p { margin: 0; color: var(--muted); font-size: 11px; line-height: 1.45; }
    .recommendation-item .rec-number { color: var(--green); font-weight: 850; }

    .chart { width: 100%; min-height: 220px; }
    .chart svg { display: block; width: 100%; height: 220px; overflow: visible; }
    .chart .grid-line { stroke: #ffffff12; stroke-width: 1; }
    .chart .axis-label { fill: #80958a; font: 10px "Segoe UI", sans-serif; }
    .chart .chart-line { fill: none; stroke: var(--green); stroke-linecap: round; stroke-linejoin: round; stroke-width: 3; }
    .chart .chart-dot { fill: var(--lime); stroke: #193126; stroke-width: 2; }
    .chart .chart-area { fill: url(#chartFill); }
    .chart-legend { display: flex; flex-wrap: wrap; gap: 12px; color: var(--muted); font-size: 10px; }
    .chart-legend span::before { display: inline-block; width: 8px; height: 8px; margin-right: 5px; border-radius: 50%; background: var(--green); content: ""; }
    .chart-legend .physical::before { background: var(--orange); }
    .chart-legend .tactic::before { background: var(--blue); }
    .chart-legend .mental::before { background: #d6a5ff; }

    .empty-state { padding: 28px 14px; color: var(--muted); text-align: center; }
    .empty-state .empty-icon { margin-bottom: 8px; font-size: 27px; }
    .notice { margin-bottom: 16px; padding: 12px 14px; border: 1px solid #ffba6b40; border-radius: 11px; background: #ffba6b12; color: #ffcb91; font-size: 12px; }
    .toast { position: fixed; z-index: 20; right: 22px; bottom: 22px; max-width: min(390px, calc(100vw - 40px)); padding: 13px 17px; border: 1px solid #43db9150; border-radius: 12px; background: #192b23; color: var(--text); box-shadow: var(--shadow); animation: enter .2s ease; }
    .toast.error { border-color: #ff777760; }
    .hidden { display: none !important; }
    .progress-track { height: 7px; overflow: hidden; border-radius: 99px; background: #ffffff12; }
    .progress-fill { height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--green), var(--lime)); }
    .score-bar { display: grid; grid-template-columns: 120px 1fr 28px; align-items: center; gap: 10px; margin: 10px 0; font-size: 11px; }
    .score-bar .progress-track { height: 6px; }
    .score-bar strong { text-align: right; }
    .select-small { width: auto; min-width: 130px; }
    .rating-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 9px 14px; }
    .rating-grid .field { grid-template-columns: 1fr 90px; align-items: center; gap: 8px; }
    .rating-grid .field > span { font-size: 11px; }
    .file-input { display: none; }

    @media (max-width: 1150px) {
      .grid-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .player-grid, .exercise-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 800px) {
      .sidebar { position: sticky; inset: 0 0 auto; width: 100%; height: auto; padding: 10px 12px; border-right: 0; border-bottom: 1px solid #ffffff10; }
      .brand { padding: 2px 5px 9px; }
      .brand-mark { width: 34px; height: 34px; border-radius: 11px; font-size: 18px; }
      .nav-label, .sidebar-footer { display: none; }
      .nav-list { display: flex; overflow-x: auto; gap: 5px; padding-bottom: 2px; }
      .nav-button { width: auto; flex: 0 0 auto; padding: 8px 10px; font-size: 11px; white-space: nowrap; }
      .nav-icon { width: auto; font-size: 14px; }
      .main-area { margin-left: 0; }
      .topbar { position: relative; min-height: 52px; padding: 10px 18px; }
      .content { padding: 25px 18px 45px; }
    }
    @media (max-width: 600px) {
      .grid-2, .grid-3, .grid-4, .player-grid, .exercise-grid { grid-template-columns: 1fr; }
      .page-heading { align-items: flex-start; flex-direction: column; }
      .page-heading .button { width: 100%; }
      .form-grid { grid-template-columns: 1fr; }
      .form-grid .full { grid-column: auto; }
      .rating-grid { grid-template-columns: 1fr; }
      .today-chip { display: none; }
      .score-bar { grid-template-columns: 100px 1fr 24px; }
      .tool-actions { width: 100%; }
      .tool-actions > * { flex: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <div class="app-shell" id="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">⚽</div>
        <div><strong>Gestor Inteligente</strong><small>Escuela de Fútbol</small></div>
      </div>
      <div class="nav-label">Espacio de trabajo</div>
      <nav class="nav-list" aria-label="Navegación principal">
        <button class="nav-button active" data-page="dashboard"><span class="nav-icon">⌂</span>Panel principal</button>
        <button class="nav-button" data-page="players"><span class="nav-icon">♟</span>Jugadores</button>
        <button class="nav-button" data-page="exercises"><span class="nav-icon">⚽</span>Ejercicios</button>
        <button class="nav-button" data-page="sessions"><span class="nav-icon">◷</span>Entrenamientos</button>
        <button class="nav-button" data-page="evaluations"><span class="nav-icon">▤</span>Evaluaciones</button>
        <button class="nav-button" data-page="progress"><span class="nav-icon">↗</span>Progreso y alertas</button>
      </nav>
      <div class="sidebar-footer">Tus datos se guardan en este dispositivo.</div>
    </aside>
    <div class="main-area">
      <header class="topbar">
        <div class="breadcrumb">Escuela / <strong id="breadcrumb-current">Panel principal</strong></div>
        <div class="top-actions">
          <span class="today-chip" id="today-chip"></span>
          <button class="button secondary small-button" id="export-group-top" type="button">↧ Exportar</button>
        </div>
      </header>
      <main class="content" id="app-content" tabindex="-1"></main>
    </div>
  </div>
  <div id="toast" class="toast hidden" role="status"></div>
  <input id="import-file" class="file-input" type="file" accept="application/json,.json">

  <script>
    "use strict";

    const STORAGE_KEY = "gestor-inteligente-escuela-futbol-v1";
    let currentAccount = null;
    const categories = {
      Tecnica: ["Pase", "Control", "Regate", "Tiro"],
      Fisica: ["Velocidad", "Resistencia", "Fuerza", "Agilidad"],
      Tactica: ["Posicionamiento", "Vision de juego", "Comprension tactica"],
      Mental: ["Disciplina", "Concentracion", "Motivacion", "Liderazgo"]
    };
    const metrics = Object.entries(categories).flatMap(([category, items]) =>
      items.map((name) => ({ category, name }))
    );
    const categoryClass = { Tecnica: "category-tech", Tactica: "category-tactic", Fisica: "category-physical", Psicologica: "category-mental" };
    const metricCategory = {
      Pase: "Tecnica", Control: "Tecnica", Regate: "Tecnica", Tiro: "Tecnica",
      Velocidad: "Fisica", Resistencia: "Fisica", Fuerza: "Fisica", Agilidad: "Fisica",
      Posicionamiento: "Tactica", "Vision de juego": "Tactica", "Comprension tactica": "Tactica",
      Disciplina: "Mental", Concentracion: "Mental", Motivacion: "Mental", Liderazgo: "Mental"
    };

    const exerciseSeed = [
      ["Técnica","Conducción en carriles","Mejorar el dominio del balón a distintas velocidades.","Conduce el balón por carriles marcados; alterna superficies de contacto y cambia de dirección a la señal.","Conos, balones",12,"Media","Básico"],
      ["Técnica","Circuito de pase corto","Perfeccionar precisión y perfil corporal en pases cortos.","En grupos de tres, realizar pases a uno o dos toques y cambiar de posición tras cada pase.","Balones, conos",15,"Media","Todos"],
      ["Técnica","Pase largo por zonas","Mejorar distancia y precisión en el pase largo.","Buscar que el balón llegue a zonas objetivo, alternando pierna dominante y no dominante.","Balones, conos, petos",18,"Media","Intermedio"],
      ["Técnica","Recepción bajo presión","Asegurar la recepción orientada con un rival cercano.","Recibir un pase, proteger el balón y jugar con un compañero antes de perder la posesión.","Balones, petos",15,"Alta","Intermedio"],
      ["Técnica","Control orientado y salida","Orientar el primer toque hacia el espacio libre.","Recibir desde diferentes ángulos y controlar hacia una puerta de conos para continuar la jugada.","Balones, conos",12,"Media","Todos"],
      ["Técnica","Regate 1 contra 1","Desarrollar fintas, cambio de ritmo y protección del balón.","Superar al defensor en un espacio reducido y conducir hasta una línea de finalización.","Balones, petos, conos",16,"Alta","Intermedio"],
      ["Técnica","Finalización en movimiento","Mejorar definición tras conducción y pase.","Alternar conducciones y paredes antes de rematar a portería desde distintas zonas.","Balones, portería, conos",20,"Alta","Intermedio"],
      ["Técnica","Reto de precisión","Aumentar la precisión del tiro y la selección del objetivo.","Rematar a zonas señaladas de la portería desde varias posiciones, registrando aciertos.","Balones, portería, objetivos",15,"Media","Todos"],
      ["Táctica","Rondo de posesión","Mejorar apoyos, líneas de pase y velocidad de circulación.","Mantener la posesión en superioridad numérica y cambiar al jugador que presiona tras recuperar.","Balones, petos",15,"Alta","Todos"],
      ["Táctica","Coberturas defensivas","Coordinar ayudas y equilibrio defensivo.","En parejas, orientar al atacante mientras el compañero cubre el espacio y cierra la línea de pase.","Balones, conos, petos",18,"Media","Intermedio"],
      ["Táctica","Presión tras pérdida","Reaccionar colectivamente durante los primeros segundos tras perder el balón.","El equipo intenta recuperar el balón inmediatamente; si no lo logra, reorganiza sus líneas.","Balones, petos",16,"Alta","Avanzado"],
      ["Táctica","Transición defensa-ataque","Mejorar la salida rápida después de recuperar el balón.","Tras una recuperación, encontrar una opción de pase hacia adelante y progresar hacia portería.","Balones, petos, porterías",20,"Alta","Intermedio"],
      ["Táctica","Sistemas de juego en zonas","Comprender ocupación de espacios y funciones por línea.","Practicar movimientos del sistema elegido con balón y pausas breves para corregir posiciones.","Conos, petos, balones",22,"Media","Avanzado"],
      ["Física","Aceleraciones de 10 metros","Desarrollar la velocidad de reacción y aceleración inicial.","Realizar salidas variadas hacia una marca; recuperar completamente entre repeticiones.","Conos, cronómetro",12,"Alta","Todos"],
      ["Física","Resistencia aeróbica con balón","Sostener esfuerzos moderados y mantener calidad técnica.","Completar bloques de carrera y conducción intercalados con pausas activas.","Balones, conos",20,"Media","Todos"],
      ["Física","Fuerza funcional unilateral","Mejorar estabilidad y fuerza aplicable a cambios de dirección.","Realizar zancadas, equilibrio y saltos controlados con técnica supervisada.","Conos, bandas opcionales",16,"Media","Intermedio"],
      ["Física","Saltos y potencia","Desarrollar potencia de piernas con aterrizajes seguros.","Alternar saltos cortos y aceleraciones, priorizando control y calidad sobre cantidad.","Conos, escalera opcional",12,"Alta","Intermedio"],
      ["Física","Agilidad en cuadrícula","Mejorar frenadas, giros y coordinación de pies.","Responder a señales del entrenador recorriendo diferentes patrones en una cuadrícula.","Conos, escalera",12,"Alta","Todos"],
      ["Psicológica","Rutina de concentración","Entrenar atención antes de ejecutar una acción técnica.","Observar una señal, recordar una consigna y resolver la tarea con distracciones controladas.","Balones, tarjetas de señales",10,"Baja","Todos"],
      ["Psicológica","Liderazgo rotativo","Practicar comunicación positiva y toma de iniciativa.","Rotar la capitanía en un juego reducido; cada líder propone una consigna sencilla y anima al grupo.","Balones, petos",15,"Baja","Todos"],
      ["Psicológica","Desafío de equipo","Fortalecer cooperación y responsabilidad compartida.","El equipo alcanza una meta de pases con roles rotativos y reflexión final sobre la colaboración.","Balones, conos",12,"Media","Todos"],
      ["Psicológica","Decidir antes de recibir","Acelerar la lectura del juego y la toma de decisiones.","Antes del control, observar opciones y elegir pase, conducción o protección según la señal del entorno.","Balones, petos, conos",15,"Media","Intermedio"]
    ].map(([category,name,objective,description,materials,duration,intensity,level], index) => ({
      id: `exercise-${index + 1}`, category, name, objective, description, materials, duration, intensity, level
    }));

    let state = loadState();
    let currentPage = "dashboard";
    let playerSearch = "";
    let exerciseSearch = "";
    let exerciseCategoryFilter = "Todas";
    let editingPlayerId = null;
    let toastTimeout = null;
    let pendingExerciseId = null;

    function getDataKey() {
      return STORAGE_KEY;
    }

    function loadState() {
      const fallback = { players: [], sessions: [], evaluations: [], exercises: exerciseSeed };
      try {
        const saved = localStorage.getItem(getDataKey());
        if (!saved) return fallback;
        const parsed = JSON.parse(saved);
        return {
          players: Array.isArray(parsed.players) ? parsed.players : [],
          sessions: Array.isArray(parsed.sessions) ? parsed.sessions : [],
          evaluations: Array.isArray(parsed.evaluations) ? parsed.evaluations : [],
          exercises: Array.isArray(parsed.exercises) && parsed.exercises.length ? parsed.exercises : exerciseSeed
        };
      } catch (error) {
        window.setTimeout(() => notify("No se pudieron cargar los datos guardados. Revisa el almacenamiento del navegador.", true), 0);
        return fallback;
      }
    }

    function saveState() {
      try {
        localStorage.setItem(getDataKey(), JSON.stringify(state));
        return true;
      } catch (error) {
        notify("No se pudieron guardar los cambios. El almacenamiento puede estar lleno o deshabilitado.", true);
        return false;
      }
    }

    function notify(message, isError = false) {
      const toast = document.querySelector("#toast");
      toast.textContent = message;
      toast.classList.toggle("error", isError);
      toast.classList.remove("hidden");
      window.clearTimeout(toastTimeout);
      toastTimeout = window.setTimeout(() => toast.classList.add("hidden"), 3400);
    }

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, (character) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      })[character]);
    }

    function safeNumber(value, digits = 1) {
      return Number.isFinite(Number(value)) ? Number(value).toFixed(digits) : "0";
    }

    function uid(prefix) {
      return `${prefix}-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 8)}`;
    }

    function dateToday() {
      const now = new Date();
      return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}-${String(now.getDate()).padStart(2, "0")}`;
    }

    function formatDate(date) {
      if (!date) return "Sin fecha";
      const parsed = new Date(`${date}T12:00:00`);
      return Number.isNaN(parsed.getTime()) ? date : parsed.toLocaleDateString("es-MX", { day: "2-digit", month: "short", year: "numeric" });
    }

    function slug(text) {
      return String(text).normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
    }

    function playerName(playerId) {
      return state.players.find((player) => player.id === playerId)?.name || "Jugador eliminado";
    }

    function playerEvaluations(playerId) {
      return state.evaluations.filter((evaluation) => evaluation.playerId === playerId)
        .sort((a, b) => a.date.localeCompare(b.date) || a.createdAt - b.createdAt);
    }

    function playerSessions(playerId) {
      return state.sessions.filter((session) => session.playerId === playerId)
        .sort((a, b) => a.date.localeCompare(b.date) || a.createdAt - b.createdAt);
    }

    function evaluationAverage(evaluation) {
      const values = metrics.map((metric) => Number(evaluation.scores?.[metric.name])).filter(Number.isFinite);
      return values.length ? values.reduce((sum, value) => sum + value, 0) / values.length : 0;
    }

    function latestEvaluation(playerId) {
      return playerEvaluations(playerId).at(-1) || null;
    }

    function currentPlayerAverage(playerId) {
      const evaluation = latestEvaluation(playerId);
      return evaluation ? evaluationAverage(evaluation) : null;
    }

    function categoryAverages(evaluation) {
      return Object.fromEntries(Object.entries(categories).map(([category, names]) => {
        const values = names.map((name) => Number(evaluation?.scores?.[name])).filter(Number.isFinite);
        return [category, values.length ? values.reduce((sum, value) => sum + value, 0) / values.length : 0];
      }));
    }

    function overallAverage() {
      const values = state.players.map((player) => currentPlayerAverage(player.id)).filter(Number.isFinite);
      return values.length ? values.reduce((sum, value) => sum + value, 0) / values.length : 0;
    }

    function performanceByPeriod(period = "month") {
      const byMonth = new Map();
      state.evaluations.forEach((evaluation) => {
        const key = evaluation.date.slice(0, period === "year" ? 4 : 7);
        if (!key) return;
        if (!byMonth.has(key)) byMonth.set(key, []);
        byMonth.get(key).push(evaluation);
      });
      return [...byMonth.entries()].sort(([a], [b]) => a.localeCompare(b)).slice(-12);
    }

    function monthLabel(month) {
      const [year, number] = month.split("-").map(Number);
      return new Date(year, number - 1, 1).toLocaleDateString("es-MX", { month: "short", year: "2-digit" });
    }

    function categoryChartSvg(category = "all", period = "month") {
      const entries = performanceByPeriod(period);
      if (!entries.length) return emptyState("📈", "Aún no hay evaluaciones para graficar.");
      const chartWidth = 620, chartHeight = 205, left = 42, right = 12, top = 14, bottom = 32;
      const plotW = chartWidth - left - right, plotH = chartHeight - top - bottom;
      const lines = category === "all" ? Object.keys(categories) : [category];
      const colors = { Tecnica: "#c8f36a", Fisica: "#ffba6b", Tactica: "#75baff", Mental: "#d6a5ff" };
      const x = (index) => left + (entries.length < 2 ? plotW / 2 : index * plotW / (entries.length - 1));
      const y = (score) => top + plotH - (score / 10) * plotH;
      const grid = [0, 2, 4, 6, 8, 10].map((score) =>
        `<line class="grid-line" x1="${left}" y1="${y(score)}" x2="${chartWidth - right}" y2="${y(score)}"></line><text class="axis-label" x="${left - 10}" y="${y(score) + 3}" text-anchor="end">${score}</text>`
      ).join("");
      const labels = entries.map(([key], index) =>
        `<text class="axis-label" x="${x(index)}" y="${chartHeight - 8}" text-anchor="middle">${escapeHtml(period === "year" ? key : monthLabel(key))}</text>`
      ).join("");
      const paths = lines.map((categoryName) => {
        const points = entries.map(([, evaluations], index) => {
          const scores = evaluations.map((evaluation) => categoryAverages(evaluation)[categoryName]).filter((score) => score > 0);
          const average = scores.length ? scores.reduce((sum, score) => sum + score, 0) / scores.length : 0;
          return { x: x(index), y: y(average), score: average };
        });
        if (!points.some((point) => point.score > 0)) return "";
        const path = points.map((point, index) => `${index ? "L" : "M"}${point.x},${point.y}`).join(" ");
        const dots = points.filter((point) => point.score > 0).map((point) =>
          `<circle cx="${point.x}" cy="${point.y}" r="4" fill="${colors[categoryName]}"><title>${categoryName}: ${point.score.toFixed(1)} / 10</title></circle>`
        ).join("");
        return `<path d="${path}" fill="none" stroke="${colors[categoryName]}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"></path>${dots}`;
      }).join("");
      return `<div class="chart"><svg viewBox="0 0 ${chartWidth} ${chartHeight}" role="img" aria-label="Evolución mensual de evaluaciones, escala de 0 a 10">${grid}${labels}${paths}</svg></div>`;
    }

    function emptyState(icon, message) {
      return `<div class="empty-state"><div class="empty-icon">${icon}</div>${escapeHtml(message)}</div>`;
    }

    function alertsForPlayer(player) {
      const alerts = [];
      const evaluations = playerEvaluations(player.id);
      const latest = evaluations.at(-1);
      const previous = evaluations.at(-2);
      if (latest && previous) {
        const change = evaluationAverage(latest) - evaluationAverage(previous);
        if (change <= -0.7) alerts.push({ level: "high", title: `${player.name}: descenso de rendimiento`, text: `El promedio bajó ${Math.abs(change).toFixed(1)} puntos respecto a la evaluación anterior.` });
        const averages = categoryAverages(latest);
        Object.entries(averages).filter(([, value]) => value > 0 && value < 5).forEach(([category, value]) =>
          alerts.push({ level: "normal", title: `${player.name}: área por reforzar`, text: `${category} tiene un promedio de ${value.toFixed(1)} / 10.` })
        );
      } else if (latest) {
        Object.entries(categoryAverages(latest)).filter(([, value]) => value > 0 && value < 5).forEach(([category, value]) =>
          alerts.push({ level: "normal", title: `${player.name}: área por reforzar`, text: `${category} tiene un promedio de ${value.toFixed(1)} / 10.` })
        );
      }
      const sessions = playerSessions(player.id);
      const absences = sessions.filter((session) => session.attendance === "Ausente").length;
      const attendance = sessions.length ? (sessions.length - absences) / sessions.length : 1;
      if (absences >= 3 || (sessions.length >= 4 && attendance < .7)) {
        alerts.push({ level: "high", title: `${player.name}: asistencia baja`, text: `${absences} ausencias en ${sessions.length} registros (${Math.round(attendance * 100)}% de asistencia).` });
      }
      if (evaluations.length >= 3) {
        const recent = evaluations.slice(-3).map(evaluationAverage);
        if (Math.max(...recent) - Math.min(...recent) < .35) {
          alerts.push({ level: "normal", title: `${player.name}: posible estancamiento`, text: "Las últimas tres evaluaciones muestran pocos cambios en el promedio." });
        }
      }
      return alerts;
    }

    function getAllAlerts() {
      return state.players.flatMap(alertsForPlayer);
    }

    function recommendationFor(player) {
      const latest = latestEvaluation(player.id);
      const scores = latest?.scores || {};
      const weaknessText = slug(player.weaknesses || "");
      const strengthsText = slug(player.strengths || "");
      const position = slug(player.position || "");
      const priorities = [];

      metrics.forEach(({ name, category }) => {
        const value = Number(scores[name]);
        if (Number.isFinite(value) && value <= 6) {
          const aliases = {
            Pase: ["pase", "posesion"],
            Control: ["recepcion", "control orientado", "conduccion"],
            Regate: ["regate", "conduccion"],
            Tiro: ["finalizacion", "precision", "tiro"],
            Velocidad: ["aceleracion", "velocidad", "agilidad"],
            Resistencia: ["resistencia", "aerobica"],
            Fuerza: ["fuerza", "potencia"],
            Agilidad: ["agilidad", "aceleracion"],
            Posicionamiento: ["cobertura", "sistemas de juego", "presion"],
            "Vision de juego": ["posesion", "decision", "transicion"],
            "Comprension tactica": ["sistemas de juego", "transicion", "presion"],
            Disciplina: ["concentracion", "equipo"],
            Concentracion: ["concentracion", "decision"],
            Motivacion: ["equipo", "liderazgo"],
            Liderazgo: ["liderazgo", "equipo"]
          };
          (aliases[name] || [slug(name)]).forEach((term) =>
            priorities.push({ term, category, weight: 5.5 - value * .35 })
          );
        }
      });
      const weaknessTerms = [
        ["definicion", "finalizacion", "precision", "tiro"],
        ["pase", "precision de pase", "pase corto"],
        ["resistencia", "condicion fisica", "fondo"],
        ["velocidad", "aceleracion"],
        ["regate", "conduccion"],
        ["decision", "toma de decisiones", "concentracion"]
      ];
      weaknessTerms.forEach((terms) => {
        if (terms.some((term) => weaknessText.includes(term))) {
          terms.forEach((term) => priorities.push({ term, category: term.includes("decision") || term.includes("concentracion") ? "Psicologica" : "Tecnica", weight: 3 }));
        }
      });
      if (position.includes("delanter") || position.includes("extremo")) {
        priorities.push({ term: "finalizacion", category: "Tecnica", weight: 1.7 }, { term: "precision", category: "Tecnica", weight: 1.4 });
      }
      if (position.includes("portero")) priorities.push({ term: "agilidad", category: "Fisica", weight: 1.4 }, { term: "concentracion", category: "Psicologica", weight: 1 });
      if (position.includes("defensa")) priorities.push({ term: "cobertura", category: "Tactica", weight: 1.2 }, { term: "pase largo", category: "Tecnica", weight: .8 });
      if (position.includes("mediocamp")) priorities.push({ term: "posesion", category: "Tactica", weight: 1.2 }, { term: "vision de juego", category: "Tactica", weight: 1.2 });

      const candidates = state.exercises.map((exercise) => {
        const text = slug(`${exercise.name} ${exercise.objective} ${exercise.category}`);
        let score = 0;
        priorities.forEach((priority) => {
          if (text.includes(priority.term)) score += priority.weight;
          else if (slug(exercise.category).includes(slug(priority.category))) score += .2;
        });
        if (strengthsText && text.split(" ").some((word) => word.length > 4 && strengthsText.includes(word))) score -= .4;
        if (player.level === "Principiante" && exercise.level === "Avanzado") score -= 2;
        if (player.level === "Avanzado" && exercise.level === "Básico") score -= .2;
        return { exercise, score };
      }).sort((a, b) => b.score - a.score || a.exercise.duration - b.exercise.duration);

      const chosen = candidates.slice(0, 3);
      const recent = playerSessions(player.id).slice(-5);
      const hours = recent.reduce((sum, session) => sum + (session.attendance === "Presente" ? Number(session.minutes || 0) : 0), 0) / 60;
      const additions = [];
      const lowCategories = latest ? Object.entries(categoryAverages(latest)).filter(([, value]) => value > 0 && value < 6).map(([name]) => name) : [];
      if (lowCategories.includes("Fisica")) additions.push("Conviene reforzar la preparación física de forma progresiva y adecuada a su edad.");
      if (lowCategories.includes("Tecnica")) additions.push("Prioriza tareas técnicas con objetivos claros y retroalimentación breve.");
      if (lowCategories.includes("Tactica")) additions.push("Refuerza la lectura del juego con tareas reducidas y preguntas guiadas.");
      if (lowCategories.includes("Mental")) additions.push("Incluye consignas de concentración, confianza y comunicación positiva.");
      if (hours > 0) additions.push(`Acumula ${hours.toFixed(1)} h en sus últimos ${recent.length} registros de entrenamiento.`);
      if (!latest) additions.push("Registra una primera evaluación para personalizar las recomendaciones según su rendimiento.");
      return { exercises: chosen, notes: additions };
    }

    function playerProgress(player) {
      const evaluations = playerEvaluations(player.id);
      if (evaluations.length < 2) return null;
      const first = evaluationAverage(evaluations[0]);
      const last = evaluationAverage(evaluations.at(-1));
      return first > 0 ? ((last - first) / first) * 100 : null;
    }

    function playerCard(player) {
      const average = currentPlayerAverage(player.id);
      const sessions = playerSessions(player.id);
      const progress = playerProgress(player);
      const initials = player.name.split(/\s+/).slice(0, 2).map((part) => part[0]).join("").toUpperCase();
      return `<article class="player-card">
        <div class="row">
          <div class="avatar">${escapeHtml(initials)}</div>
          <div><h3 class="player-name">${escapeHtml(player.name)}</h3><div class="player-meta">${escapeHtml(player.category || "Sin categoría")} · ${escapeHtml(player.position || "Sin posición")}</div></div>
        </div>
        <div class="player-stats">
          <div><strong>${player.age} <span>años</span></strong><span>Edad</span></div>
          <div><strong>${average === null ? "—" : average.toFixed(1)}</strong><span>Promedio / 10</span></div>
          <div><strong>${progress === null ? "—" : `${progress >= 0 ? "+" : ""}${progress.toFixed(0)}%`}</strong><span>Mejora</span></div>
        </div>
        <p class="small muted" style="margin:11px 0 0">${sessions.length} registros · Nivel ${escapeHtml(player.level || "Intermedio")}</p>
        <div class="card-actions">
          <button class="button ghost small-button" data-action="edit-player" data-id="${escapeHtml(player.id)}">Editar</button>
          <button class="button ghost small-button" data-action="player-report" data-id="${escapeHtml(player.id)}">Reporte</button>
          <button class="button ghost small-button" data-action="evaluate-player" data-id="${escapeHtml(player.id)}">Evaluar</button>
          <button class="button ghost small-button" data-action="delete-player" data-id="${escapeHtml(player.id)}">Eliminar</button>
        </div>
      </article>`;
    }

    function scoreBars(evaluation) {
      return Object.entries(categoryAverages(evaluation)).map(([category, value]) => `
        <div class="score-bar"><span>${escapeHtml(category)}</span><div class="progress-track"><div class="progress-fill" style="width:${Math.max(0, Math.min(100, value * 10))}%"></div></div><strong>${value.toFixed(1)}</strong></div>`
      ).join("");
    }

    function renderDashboard() {
      const playersWithScores = state.players.map((player) => ({ player, average: currentPlayerAverage(player.id) })).filter((item) => item.average !== null);
      const featured = [...playersWithScores].sort((a, b) => b.average - a.average).slice(0, 4);
      const lowPerformers = playersWithScores.filter((item) => item.average < 5).sort((a, b) => a.average - b.average);
      const attendanceRecords = state.sessions;
      const presentCount = attendanceRecords.filter((session) => session.attendance === "Presente").length;
      const attendance = attendanceRecords.length ? Math.round(presentCount / attendanceRecords.length * 100) : 0;
      const totalHours = state.sessions.reduce((sum, session) => sum + (session.attendance === "Presente" ? Number(session.minutes || 0) : 0), 0) / 60;
      const alerts = getAllAlerts().slice(0, 4);
      const recommendations = state.players.slice(0, 4).map((player) => ({ player, recommendation: recommendationFor(player) }));
      const recentEvaluations = [...state.evaluations].sort((a, b) => b.date.localeCompare(a.date)).slice(0, 5);
      return `<div class="page-heading"><div><div class="eyebrow">Vista general</div><h1>Panel del entrenador</h1><p class="page-description">Planifica mejor, acompaña el progreso y toma decisiones con información de tu equipo.</p></div><div class="row wrap tool-actions"><button class="button secondary" data-action="import-backup">↥ Importar datos</button><button class="button" data-action="new-player">＋ Registrar jugador</button></div></div>
        <section class="grid grid-4" style="margin-bottom:16px">
          <article class="card metric-card"><span class="metric-icon">♟</span><div class="metric-label">Jugadores registrados</div><div class="metric-value">${state.players.length}</div><div class="metric-foot">${new Set(state.players.map((p) => p.category).filter(Boolean)).size} categorías</div></article>
          <article class="card metric-card"><span class="metric-icon">◷</span><div class="metric-label">Entrenamientos registrados</div><div class="metric-value">${state.sessions.length}</div><div class="metric-foot">${totalHours.toFixed(1)} horas acumuladas</div></article>
          <article class="card metric-card"><span class="metric-icon">✦</span><div class="metric-label">Promedio del equipo</div><div class="metric-value">${playersWithScores.length ? overallAverage().toFixed(1) : "—"}<span style="font-size:14px;color:var(--muted)"> / 10</span></div><div class="metric-foot">${state.evaluations.length} evaluaciones</div></article>
          <article class="card metric-card"><span class="metric-icon">✓</span><div class="metric-label">Asistencia registrada</div><div class="metric-value">${attendanceRecords.length ? `${attendance}%` : "—"}</div><div class="metric-foot">${attendanceRecords.length} registros de asistencia</div></article>
        </section>
        <section class="grid grid-2" style="margin-bottom:16px">
          <article class="card"><div class="card-header"><div><h2>Evolución del equipo</h2><p>Promedios por categoría basados en las evaluaciones mensuales.</p></div><span class="badge">Últimos 12 meses</span></div>${categoryChartSvg("all")}<div class="chart-legend"><span>Técnica</span><span class="physical">Física</span><span class="tactic">Táctica</span><span class="mental">Mental</span></div></article>
          <article class="card"><div class="card-header"><div><h2>Alertas inteligentes</h2><p>Señales para acompañar al equipo a tiempo.</p></div><span class="badge ${alerts.length ? "orange" : ""}">${alerts.length} activas</span></div><div class="alert-list">${alerts.length ? alerts.map((alert) => `<div class="alert-item"><span class="alert-dot ${alert.level === "high" ? "high" : ""}"></span><div><strong>${escapeHtml(alert.title)}</strong><p>${escapeHtml(alert.text)}</p></div></div>`).join("") : emptyState("✓", "No hay alertas por ahora. Registra evaluaciones y asistencias para activar el seguimiento.")}</div></article>
        </section>
        <section class="grid grid-2">
          <article class="card"><div class="card-header"><div><h2>Jugadores destacados</h2><p>Mejor promedio en la evaluación más reciente.</p></div><button class="button ghost small-button" data-page-link="players">Ver equipo →</button></div>${featured.length ? `<div class="stack">${featured.map(({player,average},index)=>`<div class="row between"><div class="row"><span class="badge">${index+1}</span><div><strong>${escapeHtml(player.name)}</strong><div class="small muted">${escapeHtml(player.category)} · ${escapeHtml(player.position)}</div></div></div><strong style="color:var(--lime)">${average.toFixed(1)} / 10</strong></div>`).join("")}</div>` : emptyState("★","Registra jugadores y sus evaluaciones para crear el ranking.")}${lowPerformers.length?`<div class="notice" style="margin:16px 0 0">${lowPerformers.length} jugador(es) con promedio menor a 5. Revisa sus áreas de apoyo.</div>`:""}</article>

    function exerciseDiagram(exercise) {
      const name = slug(`${exercise.name} ${exercise.objective}`);
      const player = (x, y, color = "#75baff") => `<circle cx="${x}" cy="${y}" r="10" fill="${color}" stroke="#edf5ef" stroke-width="2"/><circle cx="${x}" cy="${y}" r="3" fill="#10241b"/>`;
      const ball = (x, y) => `<circle cx="${x}" cy="${y}" r="6" fill="#fff" stroke="#10241b" stroke-width="2"/><path d="M${x-3} ${y}h6M${x} ${y-3}v6" stroke="#10241b" stroke-width="1"/>`;
      const field = `<rect x="1" y="1" width="298" height="148" rx="8" fill="#285d43"/><path d="M149 2v146" stroke="#ffffff55" stroke-width="2"/><circle cx="149" cy="75" r="27" fill="none" stroke="#ffffff55" stroke-width="2"/>`;
      let drawing;
      if (/finaliz|tiro|precisión/.test(name)) {
        drawing = `${player(72,75)}${player(112,105,"#ffba6b")}${ball(84,75)}<rect x="270" y="38" width="28" height="74" fill="#101812" stroke="#fff" stroke-width="3"/><path d="M88 75Q165 38 263 57" fill="none" stroke="#c8f36a" stroke-width="3" stroke-dasharray="7 6"/><circle cx="250" cy="57" r="5" fill="#ff7777"/>`;
      } else if (/conducci|regate|control/.test(name)) {
        drawing = `${player(48,112)}${ball(58,108)}<path d="M58 108 Q95 35 124 73 T181 112 T238 52" fill="none" stroke="#c8f36a" stroke-width="3" stroke-dasharray="7 6"/><circle cx="108" cy="58" r="5" fill="#ffba6b"/><circle cx="174" cy="96" r="5" fill="#ffba6b"/><circle cx="224" cy="60" r="5" fill="#ffba6b"/>${player(250,40,"#ff7777")}`;
      } else if (/pase|recepci|salida/.test(name)) {
        drawing = `${player(42,75)}${player(110,40,"#ffba6b")}${player(110,112,"#d6a5ff")}${player(220,75,"#c8f36a")}${ball(52,75)}<path d="M52 75L100 41" stroke="#fff" stroke-width="3" marker-end="url(#arrow)"/><path d="M120 112L208 80" stroke="#c8f36a" stroke-width="3" stroke-dasharray="6 5"/>`;
      } else if (/táctica|presión|transición|defens|sistema|zonas/.test(name) || exercise.category === "Táctica") {
        drawing = `${[38,78,118].map((x, i) => player(x, 48 + i * 18, "#75baff")).join("")}${[205,245,270].map((x, i) => player(x, 42 + i * 34, "#ff7777")).join("")}<path d="M92 98L200 53" stroke="#c8f36a" stroke-width="3" stroke-dasharray="8 5"/><path d="M115 112L260 112" stroke="#fff" stroke-width="2" stroke-dasharray="5 6"/>${ball(96,96)}`;
      } else if (/aceler|resist|fuerza|agilidad|saltos/.test(name) || exercise.category === "Física") {
        drawing = `${player(48,112,"#75baff")}${player(48,42,"#ffba6b")}<path d="M58 112H248" stroke="#c8f36a" stroke-width="3" stroke-dasharray="8 5"/><path d="M58 42H248" stroke="#fff" stroke-width="2" stroke-dasharray="8 5"/><rect x="235" y="101" width="24" height="22" fill="none" stroke="#ffba6b" stroke-width="3"/><rect x="235" y="31" width="24" height="22" fill="none" stroke="#ffba6b" stroke-width="3"/>`;
      } else if (exercise.category === "Psicológica") {
        drawing = `${player(70,74,"#d6a5ff")}${player(230,74,"#75baff")}${ball(150,75)}<path d="M89 74h110" stroke="#c8f36a" stroke-width="3" stroke-dasharray="7 5"/><path d="M150 75q-20-35-35-35" fill="none" stroke="#fff" stroke-width="2"/><path d="M150 75q20-35 35-35" fill="none" stroke="#fff" stroke-width="2"/><circle cx="115" cy="40" r="8" fill="#ffba6b"/><circle cx="185" cy="40" r="8" fill="#ff7777"/>`;
      } else {
        drawing = `${player(55,75)}${player(245,75,"#ff7777")}${player(150,40,"#ffba6b")}${ball(65,75)}<path d="M65 75H235" stroke="#c8f36a" stroke-width="3" stroke-dasharray="7 5"/>`;
      }
      return `<svg viewBox="0 0 300 150" role="img" aria-label="Esquema de ${escapeHtml(exercise.name)}"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#fff"/></marker></defs>${field}${drawing}<text class="demo-label" x="12" y="139">Esquema del ejercicio</text></svg>`;
    }

cise.id)}">↺ Reiniciar</button></div></div></article>`).join(""):emptyState("⚽","No hay ejercicios que coincidan con tu búsqueda.")}</section>`;
    }

    let exerciseTimerId = null;
    let exerciseTimerStarted = null;
    let exerciseTimerElapsed = 0;
    let activeExerciseId = null;

    function updateExerciseTimer() {
      if (!activeExerciseId) return;
      const elapsed = exerciseTimerElapsed + (exerciseTimerStarted ? Date.now() - exerciseTimerStarted : 0);
      const totalSeconds = Math.floor(elapsed / 1000);
      const minutes = String(Math.floor(totalSeconds / 60)).padStart(2, "0");
      const seconds = String(totalSeconds % 60).padStart(2, "0");
      const timer = document.querySelector(`[data-timer="${activeExerciseId}"]`);
      if (timer) timer.textContent = `${minutes}:${seconds}`;
    }

    function startExerciseTimer(id) {
      if (activeExerciseId && activeExerciseId !== id) {
        if (exerciseTimerStarted) exerciseTimerElapsed += Date.now() - exerciseTimerStarted;
        exerciseTimerStarted = null;
      }
      if (activeExerciseId !== id) exerciseTimerElapsed = 0;
      activeExerciseId = id;
      if (!exerciseTimerStarted) exerciseTimerStarted = Date.now();
      window.clearInterval(exerciseTimerId);
      exerciseTimerId = window.setInterval(updateExerciseTimer, 250);
      document.querySelectorAll(".exercise-demo").forEach((demo) => demo.classList.remove("demo-stop"));
    }

    function pauseExerciseTimer() {
      if (exerciseTimerStarted) exerciseTimerElapsed += Date.now() - exerciseTimerStarted;
      exerciseTimerStarted = null;
      window.clearInterval(exerciseTimerId);
      document.querySelectorAll(".exercise-demo").forEach((demo) => demo.classList.add("demo-stop"));
      updateExerciseTimer();
    }

    function resetExerciseTimer(id) {
      window.clearInterval(exerciseTimerId);
      exerciseTimerStarted = null;
      exerciseTimerElapsed = 0;
      activeExerciseId = id;
      const timer = document.querySelector(`[data-timer="${id}"]`);
      if (timer) timer.textContent = "00:00";
      document.querySelectorAll(".exercise-demo").forEach((demo) => demo.classList.remove("demo-stop"));
    }

    function renderProgress() {
      const alerts = getAllAlerts();
      const ranking = state.players.map((player)=>({player,average:currentPlayerAverage(player.id),progress:playerProgress(player)})).filter((item)=>item.average!==null).sort((a,b)=>(b.progress??-Infinity)-(a.progress??-Infinity));
      const selectedPlayerId = document.querySelector("#recommend-player")?.value || state.players[0]?.id || "";
      const player = state.players.find((item)=>item.id===selectedPlayerId);
      const recommendation = player ? recommendationFor(player) : null;
      const exerciseCounts = new Map();
      state.sessions.forEach((session)=>session.exerciseIds.forEach((id)=>exerciseCounts.set(id,(exerciseCounts.get(id)||0)+1)));
      const mostUsed=[...exerciseCounts.entries()].sort((a,b)=>b[1]-a[1]).slice(0,5);
      const totalHours=state.sessions.reduce((sum,session)=>sum+(session.attendance==="Presente"?Number(session.minutes||0):0),0)/60;
      const attendanceRecords=state.sessions;
      const attendance=attendanceRecords.length?Math.round(attendanceRecords.filter((session)=>session.attendance==="Presente").length/attendanceRecords.length*100):0;
      return `<div class="page-heading"><div><div class="eyebrow">Analítica formativa</div><h1>Progreso y alertas</h1><p class="page-description">Compara evaluaciones, detecta tendencias y transforma los datos en próximos pasos de entrenamiento.</p></div><button class="button" data-action="export-group">↧ Exportar reporte grupal</button></div>
        <section class="grid grid-3" style="margin-bottom:16px">
          <article class="card metric-card"><span class="metric-icon">◷</span><div class="metric-label">Horas de entrenamiento</div><div class="metric-value">${totalHours.toFixed(1)}</div><div class="metric-foot">Tiempo registrado con asistencia</div></article>
          <article class="card metric-card"><span class="metric-icon">✓</span><div class="metric-label">Asistencia del equipo</div><div class="metric-value">${attendanceRecords.length?`${attendance}%`:"—"}</div><div class="metric-foot">${attendanceRecords.length} registros</div></article>
          <article class="card metric-card"><span class="metric-icon">↗</span><div class="metric-label">Alertas activas</div><div class="metric-value">${alerts.length}</div><div class="metric-foot">Basadas en evaluaciones e inasistencias</div></article>
        </section>
        <section class="grid grid-2" style="margin-bottom:16px">
          <article class="card"><div class="card-header"><div><h2>Evolución anual del equipo</h2><p>Comparación de promedios por categoría en cada año evaluado.</p></div></div>${categoryChartSvg("all","year")}<div class="chart-legend"><span>Técnica</span><span class="physical">Física</span><span class="tactic">Táctica</span><span class="mental">Mental</span></div></article>
          <article class="card"><div class="card-header"><div><h2>Evolución mensual del equipo</h2><p>Detalle reciente del promedio mensual por área.</p></div></div>${categoryChartSvg("all","month")}<div class="chart-legend"><span>Técnica</span><span class="physical">Física</span><span class="tactic">Táctica</span><span class="mental">Mental</span></div></article>
        </section>
        <section class="grid grid-2" style="margin-bottom:16px">
          ${Object.keys(categories).map((category)=>`<article class="card"><div class="card-header"><div><h2>Evolución ${escapeHtml(category.toLowerCase())}</h2><p>Promedio mensual de 1 a 10.</p></div></div>${categoryChartSvg(category)}</article>`).join("")}
        </section>
        <section class="grid grid-2" style="margin-bottom:16px">
          <article class="card"><div class="card-header"><div><h2>Recomendador inteligente</h2><p>Combina posición, nivel, fortalezas, debilidades y última evaluación.</p></div></div>
            ${state.players.length?`<label class="field"><span>Jugador</span><select id="recommend-player" class="select">${state.players.map((item)=>`<option value="${escapeHtml(item.id)}" ${item.id===selectedPlayerId?"selected":""}>${escapeHtml(item.name)} · ${escapeHtml(item.position)}</option>`).join("")}</select></label><div id="recommendation-results" class="recommendation-list" style="margin-top:14px">${recommendationMarkup(player,recommendation)}</div>`:emptyState("✦","Registra jugadores para generar recomendaciones individualizadas.")}</article>
          <article class="card"><div class="card-header"><div><h2>Ejercicios más utilizados</h2><p>Frecuencia en los registros de sesión.</p></div></div>${mostUsed.length?mostUsed.map(([id,count])=>{const exercise=state.exercises.find((item)=>item.id===id);return `<div class="row between" style="margin:14px 0"><span>${escapeHtml(exercise?.name||"Ejercicio eliminado")}</span><span class="badge">${count} veces</span></div>`}).join(""):emptyState("⚽","Registra sesiones y selecciona ejercicios para ver su uso.")}</article>
        </section>
        <section class="grid grid-2">
          <article class="card"><div class="card-header"><div><h2>Alertas inteligentes</h2><p>Descenso, áreas de atención, ausencias y posible estancamiento.</p></div><span class="badge ${alerts.length?"orange":""}">${alerts.length}</span></div><div class="alert-list">${alerts.length?alerts.map((alert)=>`<div class="alert-item"><span class="alert-dot ${alert.level==="high"?"high":""}"></span><div><strong>${escapeHtml(alert.title)}</strong><p>${escapeHtml(alert.text)}</p></div></div>`).join(""):emptyState("✓","No se detectan alertas. Para obtener tendencias, registra evaluaciones y asistencia de forma periódica.")}</div></article>
          <article class="card"><div class="card-header"><div><h2>Ranking de progreso</h2><p>Cambio entre la primera y la última evaluación.</p></div></div>${ranking.length?`<div class="table-wrap"><table><thead><tr><th>#</th><th>Jugador</th><th>Promedio</th><th>Mejora</th></tr></thead><tbody>${ranking.map((item,index)=>`<tr><td>${index+1}</td><td>${escapeHtml(item.player.name)}</td><td>${item.average.toFixed(1)}/10</td><td>${item.progress===null?"—":`${item.progress>=0?"+":""}${item.progress.toFixed(1)}%`}</td></tr>`).join("")}</tbody></table></div>`:emptyState("↗","Se necesitan al menos una evaluación por jugador para crear el ranking.")}</article>
        </section>`;
    }

    function recommendationMarkup(player, recommendation) {
      if (!player || !recommendation) return emptyState("✦","Selecciona un jugador.");
      const exercises=recommendation.exercises.filter((item)=>item.score>0);
      const messages=[];
      if(player.weaknesses&&slug(player.weaknesses).includes("defin")) messages.push("El jugador presenta un área a trabajar en definición. Prioriza finalización, precisión y toma de decisiones.");
      const previous=playerEvaluations(player.id);
      if(previous.length>=2){
        const first=previous.at(-2), last=previous.at(-1);
        const previousPass=Number(first.scores.Pase), currentPass=Number(last.scores.Pase);
        if(currentPass>previousPass&&previousPass>0){
          const passPercent=((currentPass-previousPass)/previousPass)*100;
          messages.push(`El jugador ha mejorado un ${passPercent.toFixed(0)}% en precisión de pase desde la evaluación anterior.`);
        }
      }
      return `${exercises.length?exercises.map(({exercise},index)=>`<div class="recommendation-item"><span class="rec-number">${index+1}</span><div><strong>${escapeHtml(exercise.name)} · ${exercise.duration} min</strong><p>${escapeHtml(exercise.objective)} Intensidad ${escapeHtml(exercise.intensity.toLowerCase())}; nivel ${escapeHtml(exercise.level.toLowerCase())}.</p></div></div>`).join(""):emptyState("⚽","Explora la biblioteca de ejercicios; no hay coincidencias suficientes para personalizar una selección.")}${messages.map((message)=>`<div class="notice" style="margin:0">${escapeHtml(message)}</div>`).join("")}${recommendation.notes.map((note)=>`<div class="recommendation-item"><span class="rec-number">✦</span><div><p>${escapeHtml(note)}</p></div></div>`).join("")}`;
    }

    const pageNames = { dashboard:"Panel principal", players:"Jugadores", exercises:"Ejercicios", sessions:"Entrenamientos", evaluations:"Evaluaciones", progress:"Progreso y alertas" };
    function renderPage(page = currentPage) {
      currentPage = page;
      document.querySelectorAll(".nav-button").forEach((button)=>button.classList.toggle("active",button.dataset.page===page));
      document.querySelector("#breadcrumb-current").textContent=pageNames[page]||pageNames.dashboard;
      const content=document.querySelector("#app-content");
      if(page==="dashboard") content.innerHTML=renderDashboard();
      else if(page==="players") content.innerHTML=playerForm();
      else if(page==="exercises") content.innerHTML=renderExercises();
      else if(page==="sessions") content.innerHTML=renderSessions();
      else if(page==="evaluations") content.innerHTML=evaluationForm();
      else if(page==="progress") content.innerHTML=renderProgress();
      else content.innerHTML=renderDashboard();
      bindPageEvents();
    }

    function bindPageEvents() {
      const playerFormElement=document.querySelector("#player-form");
      if(playerFormElement) playerFormElement.addEventListener("submit",savePlayer);
      const sessionForm=document.querySelector("#session-form");
      if(sessionForm) sessionForm.addEventListener("submit",saveSession);
      const evaluationFormElement=document.querySelector("#evaluation-form");
      if(evaluationFormElement) evaluationFormElement.addEventListener("submit",saveEvaluation);
      document.querySelector("#player-search")?.addEventListener("input",(event)=>{
        playerSearch=event.target.value;
        const grid=document.querySelector("#player-grid");
        if(grid) grid.innerHTML=renderPlayerCards(playerSearch);
      });
      document.querySelector("#player-category-filter")?.addEventListener("change",()=>{
        const grid=document.querySelector("#player-grid");
        if(grid) grid.innerHTML=renderPlayerCards(playerSearch);
      });
      document.querySelector("#exercise-search")?.addEventListener("input",(event)=>{
        exerciseSearch=event.target.value;
        const scroll=window.scrollY;
        document.querySelector("#app-content").innerHTML=renderExercises();
        bindPageEvents();
        window.scrollTo(0,scroll);
        document.querySelector("#exercise-search")?.focus();
        const input=document.querySelector("#exercise-search");
        if(input){input.setSelectionRange(input.value.length,input.value.length);}
      });
      document.querySelector("#exercise-filter")?.addEventListener("change",(event)=>{
        exerciseCategoryFilter=event.target.value;
        renderPage("exercises");
      });
      document.querySelector("#recommend-player")?.addEventListener("change",(event)=>{
        const player=state.players.find((item)=>item.id===event.target.value);
        document.querySelector("#recommendation-results").innerHTML=recommendationMarkup(player,player?recommendationFor(player):null);
      });
    }

    function savePlayer(event) {
      event.preventDefault();
      const form=event.currentTarget;
      const data=new FormData(form);
      const age=Number(data.get("age"));
      const playerData={
        id:form.dataset.id||uid("player"),
        name:String(data.get("name")).trim(), age, category:String(data.get("category")),
        position:String(data.get("position")), level:String(data.get("level")),
        weight:data.get("weight")?Number(data.get("weight")):null,
        height:data.get("height")?Number(data.get("height")):null,
        joinedAt:String(data.get("joinedAt")), strengths:String(data.get("strengths")).trim(),
        weaknesses:String(data.get("weaknesses")).trim(), notes:String(data.get("notes")).trim()
      };
      if(!playerData.name||!Number.isInteger(age)||age<5||age>60){
        document.querySelector("#player-form-error").textContent="Revisa el nombre y la edad (de 5 a 60 años).";
        return;
      }
      const existingIndex=state.players.findIndex((player)=>player.id===playerData.id);
      if(existingIndex>=0) state.players[existingIndex]=playerData;
      else state.players.push(playerData);
      saveState();
      notify(existingIndex>=0?"Ficha del jugador actualizada.":"Jugador registrado correctamente.");
      editingPlayerId=null;
      playerSearch="";
      renderPage("players");
    }

    function saveSession(event) {
      event.preventDefault();
      const form=event.currentTarget, data=new FormData(form);
      const attendance=String(data.get("attendance"));
      const minutes=Number(data.get("minutes"));
      const intensity=Number(data.get("intensity"));
      if(attendance==="Presente"&&(!Number.isInteger(minutes)||minutes<0||minutes>600)){
        document.querySelector("#session-form-error").textContent="El tiempo debe ser un número entre 0 y 600 minutos.";
        return;
      }
      const selected=[...form.elements.exerciseIds.selectedOptions].map((option)=>option.value);
      state.sessions.push({
        id:uid("session"), date:String(data.get("date")), coach:String(data.get("coach")).trim(),
        playerId:String(data.get("playerId")), attendance,
        minutes:attendance==="Presente"?minutes:0, intensity:attendance==="Presente"?intensity:0,
        exerciseIds:attendance==="Presente"?selected:[], notes:String(data.get("notes")).trim(), createdAt:Date.now()
      });
      saveState();
      pendingExerciseId = null;
      notify(attendance=== "Ausente"?"Ausencia registrada.":"Sesión registrada correctamente.");
      renderPage("sessions");
    }

    function saveEvaluation(event) {
      event.preventDefault();
      const form=event.currentTarget, data=new FormData(form);
      const scores={};
      metrics.forEach(({name})=>scores[name]=Number(data.get(`score-${name}`)));
      if(metrics.some(({name})=>!Number.isInteger(scores[name])||scores[name]<1||scores[name]>10)){
        document.querySelector("#evaluation-form-error").textContent="Todas las puntuaciones deben estar entre 1 y 10.";
        return;
      }
      state.evaluations.push({
        id:uid("evaluation"), playerId:String(data.get("playerId")), date:String(data.get("date")),
        coach:String(data.get("coach")).trim(), notes:String(data.get("notes")).trim(),
        scores, createdAt:Date.now()
      });
      saveState();
      notify("Evaluación guardada. El progreso y las recomendaciones se actualizaron.");
      renderPage("evaluations");
    }

    function handleAction(event) {
      const button=event.currentTarget;
      const action=button.dataset.action;
      const id=button.dataset.id;
      if(action=== "show-exercise"){
        const guide=document.querySelector(`#guide-${CSS.escape(id)}`);
        if(guide){guide.classList.toggle("hidden");button.textContent=guide.classList.contains("hidden")?"Ver guía y animación":"Ocultar guía";}
      } else if(action=== "start-exercise"){
        startExerciseTimer(id);
        notify("Cronómetro iniciado.");
      } else if(action=== "pause-exercise"){
        pauseExerciseTimer();notify("Cronómetro pausado.");
      } else if(action=== "reset-exercise"){
        resetExerciseTimer(id);notify("Cronómetro reiniciado.");
      } else if(action=== "use-exercise"){
        pendingExerciseId=id;renderPage("sessions");
        const exercise=state.exercises.find((item)=>item.id===id);
        notify(`Selecciona al jugador para usar “${exercise?.name||"el ejercicio"}”.`);
      } else if(action=== "new-player"){
        const panel=document.querySelector("#new-player-panel");
        if(panel){panel.classList.remove("hidden");panel.querySelector('[name="name"]').focus();}
        else renderPage("players");
      } else if(action==="close-player-form") {
        document.querySelector("#new-player-panel")?.classList.add("hidden");
      } else if(action==="cancel-edit") {
        editingPlayerId=null;renderPage("players");
      } else if(action==="edit-player") {
        const player=state.players.find((item)=>item.id===id);
        if(player){renderPage("players");document.querySelector("#app-content").innerHTML=playerForm(player);bindPageEvents();}
      } else if(action==="delete-player") {
        const player=state.players.find((item)=>item.id===id);
        if(player&&confirm(`¿Eliminar a ${player.name}? También se quitarán sus sesiones y evaluaciones.`)){
          state.players=state.players.filter((item)=>item.id!==id);
          state.sessions=state.sessions.filter((item)=>item.playerId!==id);
          state.evaluations=state.evaluations.filter((item)=>item.playerId!==id);
          saveState();notify("Jugador y datos relacionados eliminados.");renderPage("players");
        }
      } else if(action==="evaluate-player") {
        renderPage("evaluations");
        const select=document.querySelector('#evaluation-form [name="playerId"]');
        if(select)select.value=id;
      } else if(action==="delete-session") {
        if(confirm("¿Eliminar este registro de entrenamiento?")){
          state.sessions=state.sessions.filter((item)=>item.id!==id);saveState();notify("Registro eliminado.");renderPage("sessions");
        }
      } else if(action==="delete-evaluation") {
        if(confirm("¿Eliminar esta evaluación?")){
          state.evaluations=state.evaluations.filter((item)=>item.id!==id);saveState();notify("Evaluación eliminada.");renderPage("evaluations");
        }
      } else if(action==="player-report") exportPlayerReport(id);
      else if(action==="export-group") exportGroupReport();
      else if(action==="import-backup") document.querySelector("#import-file").click();
    }

    function downloadJson(filename, data) {
      try {
        const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
        const url=URL.createObjectURL(blob);
        const link=document.createElement("a");
        link.href=url;link.download=filename;link.click();
        window.setTimeout(()=>URL.revokeObjectURL(url),1000);
        notify("Reporte exportado correctamente.");
      } catch(error) {
        notify("No fue posible exportar el reporte.",true);
      }
    }

    function exportPlayerReport(playerId) {
      const player=state.players.find((item)=>item.id===playerId);
      if(!player){notify("No se encontró la ficha solicitada.",true);return;}
      const evaluations=playerEvaluations(playerId);
      const sessions=playerSessions(playerId);
      const report={
        generatedAt:new Date().toISOString(), player,
        summary:{
          latestAverage:evaluations.length?evaluationAverage(evaluations.at(-1)):null,
          improvementPercent:playerProgress(player),
          sessions:sessions.length,
          attendancePercent:sessions.length?Math.round(sessions.filter((session)=>session.attendance==="Presente").length/sessions.length*100):null,
          trainingHours:sessions.reduce((sum,session)=>sum+(session.attendance==="Presente"?Number(session.minutes||0):0),0)/60
        },
        recommendations:recommendationFor(player).exercises.map(({exercise})=>exercise),
        alerts:alertsForPlayer(player), evaluations, sessions
      };
      downloadJson(`reporte-${slug(player.name).replace(/\s+/g,"-")}.json`,report);
    }

    function exportGroupReport() {
      const report={
        system:"Gestor Inteligente para Escuela de Fútbol",
        generatedAt:new Date().toISOString(),
        statistics:{
          players:state.players.length,sessions:state.sessions.length,evaluations:state.evaluations.length,
          teamAverage:state.players.some((player)=>currentPlayerAverage(player.id)!==null)?overallAverage():null,
          trainingHours:state.sessions.reduce((sum,session)=>sum+(session.attendance==="Presente"?Number(session.minutes||0):0),0)/60,
          attendancePercent:state.sessions.length?Math.round(state.sessions.filter((session)=>session.attendance==="Presente").length/state.sessions.length*100):null,
          exerciseUsage:state.exercises.map((exercise)=>({name:exercise.name,count:state.sessions.reduce((sum,session)=>sum+session.exerciseIds.filter((id)=>id===exercise.id).length,0)})).sort((a,b)=>b.count-a.count)
        },
        alerts:getAllAlerts(), players:state.players, exercises:state.exercises, sessions:state.sessions, evaluations:state.evaluations
      };
      downloadJson(`reporte-grupal-${dateToday()}.json`,report);
    }

    function importBackup(event) {
      const file=event.target.files?.[0];
      if(!file)return;
      const reader=new FileReader();
      reader.onload=()=>{
        try{
          const parsed=JSON.parse(String(reader.result));
          const imported=parsed.players?parsed:parsed.data;
          if(!imported||!Array.isArray(imported.players)||!Array.isArray(imported.sessions)||!Array.isArray(imported.evaluations)){
            throw new Error("Estructura no reconocida");
          }
          if(!confirm(`Se importarán ${imported.players.length} jugadores, ${imported.sessions.length} sesiones y ${imported.evaluations.length} evaluaciones. Se reemplazarán los datos actuales. ¿Continuar?`))return;
          state={players:imported.players,sessions:imported.sessions,evaluations:imported.evaluations,exercises:Array.isArray(imported.exercises)?imported.exercises:exerciseSeed};
          saveState();notify("Respaldo importado correctamente.");renderPage("dashboard");
        }catch(error){notify("El archivo no contiene un respaldo válido del Gestor.",true);}
        finally{event.target.value="";}
      };
      reader.onerror=()=>notify("No se pudo leer el archivo seleccionado.",true);
      reader.readAsText(file);
    }

    function showApp(account) {
      currentAccount = account;
      state = loadState();
      document.querySelector("#app-shell").classList.remove("hidden");
      if (document.querySelector("#account-name")) document.querySelector("#account-name").textContent = account?.name || "";
      renderPage("dashboard");
    }

    document.querySelectorAll(".nav-button").forEach((button)=>button.addEventListener("click",()=>renderPage(button.dataset.page)));
    document.querySelector("#app-content").addEventListener("click",(event)=>{
      const target=event.target instanceof Element ? event.target : null;
      const actionButton=target?.closest("[data-action]");
      const pageButton=target?.closest("[data-page-link]");
      if(actionButton) handleAction({currentTarget:actionButton});
      else if(pageButton) renderPage(pageButton.dataset.pageLink);
    });
    document.querySelector("#export-group-top").addEventListener("click",exportGroupReport);
    document.querySelector("#import-file").addEventListener("change",importBackup);
    document.querySelector("#today-chip").textContent=new Date().toLocaleDateString("es-MX",{weekday:"short",day:"numeric",month:"short",year:"numeric"});
    showApp(null);
  </script>
</body>
</html>
